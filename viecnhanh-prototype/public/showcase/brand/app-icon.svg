<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-labelledby="title desc"><title id="title">ViệcNhanh Aichi — biểu tượng ứng dụng</title><desc id="desc">Nét chữ W của logo hiện tại, tinh chỉnh cho biểu tượng ứng dụng bằng Bold Blue và Light Blue. Thiết kế vector nguyên bản cho bản mẫu.</desc><rect width="96" height="96" rx="24" fill="#1B22A7"/><path d="M24 0h48q24 0 24 24v9L0 63V24Q0 0 24 0Z" fill="#4260E6" fill-opacity=".55"/><rect x="4.5" y="4.5" width="87" height="87" rx="20" fill="none" stroke="#fff" stroke-opacity=".1"/><path d="m24 29 14 39 10-25 10 25 14-39" fill="none" stroke="#fff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
